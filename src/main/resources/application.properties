spring.application.name=resource-booking-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_booking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:resource-booking-system}
jwt.audience=${JWT_AUDIENCE:resource-booking-api}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
seed.admin.password=${SEED_ADMIN_PASSWORD}
seed.user.password=${SEED_USER_PASSWORD}